<html lang="en">

      background: #e8f5e9;
      font-size: 16px;
      color: #212121;
    }
    .chat-container {
      max-width: 480px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: white;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    @media (min-width: 481px) { body { background: #e8f5e9; } }
    header {
      position: sticky; top: 0;
      background: white;
      border-bottom: 1px solid #f0f0f0;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .header-left button { background: none; border: none; padding: 8px; margin: -8px; cursor: pointer; }
    .logo { width: 32px; height: 32px; border-radius: 50%; background: #E8F5E9; display: flex; align-items: center; justify-content: center; }
    .logo svg { width: 18px; height: 18px; fill: #2E7D32; }
    .header-title h1 { font-size: 16px; font-weight: 600; margin: 0; line-height: 1.2; }
    .header-title .status { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #616161; }
    .header-title .status span { width: 8px; height: 8px; border-radius: 50%; background: #4CAF50; }
    .header-right button { width: 36px; height: 36px; border-radius: 50%; background: #E8F5E9; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    main { flex: 1; overflow-y: auto; padding-bottom: 16px; }
    footer {
      background: white;
      border-top: 1px solid #f0f0f0;
      padding: 8px 16px;
      display: flex;
      justify-content: space-around;
    }
    footer button {
      display: flex; flex-direction: column; align-items: center;
      padding: 8px 16px; background: none; border: none; color: #616161; cursor: pointer;
    }
    footer button span { font-size: 12px; margin-top: 4px; }
    footer button.active { color: #2E7D32; }
    .chat-bubble { max-width: 85%; padding: 12px 16px; border-radius: 18px; margin: 0 16px 8px; }
    .chat-bubble.bot { background: #E8F5E9; border-bottom-left-radius: 4px; margin-right: auto; }
    .chat-bubble.user { background: #2E7D32; color: white; border-bottom-right-radius: 4px; margin-left: auto; }
    .quick-reply {
      display: inline-block; padding: 8px 14px; background: #E8F5E9;
      border: 1px solid #2E7D32; border-radius: 20px; color: #2E7D32;
      font-size: 14px; font-weight: 500; cursor: pointer; margin: 4px;
    }
    .quick-reply:hover { background: #2E7D32; color: white; }
    .card {
      background: white; border-radius: 12px; padding: 16px;
      margin: 0 16px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .primary-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: calc(100% - 32px); margin: 0 16px; padding: 14px 24px;
      background: #2E7D32; color: white; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 600; cursor: pointer; min-height: 48px;
    }
    .primary-btn:disabled { background: #a5d6a7; cursor: not-allowed; }
    .primary-btn:active { background: #1b5e20; }
    .secondary-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: calc(100% - 32px); margin: 0 16px; padding: 14px 24px;
      background: white; color: #2E7D32; border: 2px solid #2E7D32;
      border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .form-group { margin-bottom: 16px; padding: 0 16px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; color: #616161; margin-bottom: 6px; }
    .form-group input, .form-group select {
      width: 100%; padding: 12px 16px; border: 1px solid #e0e0e0;
      border-radius: 8px; font-size: 16px; outline: none; font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus { border-color: #2E7D32; }
    .risk-tag {
      display: inline-block; padding: 4px 12px; border-radius: 16px;
      font-size: 12px; font-weight: 600; text-transform: uppercase;
    }
    .risk-low { background: #E8F5E9; color: #4CAF50; }
    .risk-medium { background: #FFF3E0; color: #FF9800; }
    .risk-high { background: #FFEBEE; color: #F44336; }
    .progress-bar { height: 8px; background: #E8F5E9; border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: #2E7D32; border-radius: 4px; transition: width 0.3s; }
    .timeline-item { position: relative; padding-left: 24px; padding-bottom: 20px; border-left: 2px solid #E8F5E9; }
    .timeline-item:last-child { border-left-color: transparent; padding-bottom: 0; }
    .timeline-item::before {
      content: ''; position: absolute; left: -7px; top: 0;
      width: 12px; height: 12px; border-radius: 50%;
      background: #2E7D32; border: 2px solid white;
    }
    .timeline-item.done::before { background: #4CAF50; }
    .table-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .table-row:last-child { border-bottom: none; font-weight: 700; color: #2E7D32; }
    .tab-btn {
      flex: 1; padding: 12px; border: none; background: transparent;
      font-size: 14px; font-weight: 500; color: #616161; cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active { color: #2E7D32; border-bottom-color: #2E7D32; }
    .back-btn { display: flex; align-items: center; gap: 4px; padding: 8px; border: none; background: transparent; color: #616161; cursor: pointer; font-size: 14px; }
    .back-btn:active { color: #2E7D32; }
    .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .section-title { font-size: 20px; font-weight: 700; margin: 0 16px 8px; }
    .section-subtitle { font-size: 14px; color: #616161; margin: 0 16px 16px; }
    .icon-btn { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; }
    .sticky-input {

      display: flex; gap: 8px; align-items: center;
    }
    .sticky-input input {

    }

    .bg-gm-green { background: #2E7D32; }
    .text-gm-green { color: #2E7D32; }
    .bg-gm-green-light { background: #E8F5E9; }

    .typing { display: flex; gap: 4px; padding: 12px 16px; }
    .typing span { width: 8px; height: 8px; border-radius: 50%; background: #2E7D32; animation: bounce 1s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    function updateRegion() {
      const regionSelect = document.getElementById('regionSelect');
      const districtSelect = document.getElementById('districtSelect');
      const townSelect = document.getElementById('townSelect');
      const selectedRegion = regionSelect.value;
      
      districtSelect.innerHTML = '<option value="">Select District</option>';
      townSelect.innerHTML = '<option value="">Select Town/Community</option>';
      
      if (selectedRegion && ghanaLocations.regions[selectedRegion]) {
        const districts = Object.keys(ghanaLocations.regions[selectedRegion].districts);
        districts.forEach(d => {
          districtSelect.innerHTML += `<option value="${d}">${d}</option>`;
        });
        districtSelect.disabled = false;
      } else {
        districtSelect.disabled = true;
      }
      townSelect.disabled = true;
    }

    function updateDistrict() {
      const regionSelect = document.getElementById('regionSelect');
      const districtSelect = document.getElementById('districtSelect');
      const townSelect = document.getElementById('townSelect');
      const selectedRegion = regionSelect.value;
      const selectedDistrict = districtSelect.value;
      
      townSelect.innerHTML = '<option value="">Select Town/Community</option>';
      
      if (selectedRegion && selectedDistrict && ghanaLocations.regions[selectedRegion].districts[selectedDistrict]) {
        const towns = ghanaLocations.regions[selectedRegion].districts[selectedDistrict];
        towns.forEach(t => {
          townSelect.innerHTML += `<option value="${t}">${t}</option>`;
        });
        townSelect.disabled = false;
      } else {
        townSelect.disabled = true;
      }
    }

    function updateTown() {
      state.userData.town = document.getElementById('townSelect').value;
    }

    function navigate(screen, addToHistory = true) {
      if (addToHistory && state.currentScreen !== screen) {
        state.history.push(state.currentScreen);
      }
      state.currentScreen = screen;
      render();
    }

    function goBack() {
      if (state.history.length > 0) {
        state.currentScreen = state.history.pop();
        render();
      }
    }

    function updateUserData(key, value) {
      state.userData[key] = value;
    }

    function toggleActivity(id) {
      state.activities = state.activities.map(a => 
        a.id === id ? { ...a, status: a.status === 'done' ? 'pending' : 'done' } : a
      );
      if (state.currentScreen === 'activity') render();
      else navigate('activity');
    }

          6: { advice: ['Apply before rainfall', 'Use urea 1 bag/acre', 'At 4-6 weeks after planting', 'Split application if possible'], inputs: [{n:'Urea',q:'1 bag',c:200},{n:'Labour',q:'2 persons',c:40}] },
          7: { advice: ['Harvest when fully dry', 'Check moisture <15%', 'Harvest within 2 weeks', 'Dry before storage'], inputs: [{n:'Harvest Labour',q:'5 persons',c:150},{n:'Shelling',q:'2 bags',c:40}] }

              <p style="font-weight:600;margin:0">${acres} acres</p>

            <div style="padding:10px;background:white;border-radius:8px;">
              <p style="color:#616161;margin:0 0 2px">Total Output</p>
              <p style="font-weight:600;margin:0">${totalOutput.toLocaleString()} kg</p>

      // Recalculate displayed values live

      const yieldPerAcre = farmPlan.yieldEstimate?.perAcre || 2000;
      const totalOutput = yieldPerAcre * acres;
      const revenue = Math.round(totalOutput * price);
      const profit = revenue - farmPlan.budget.totalCost;
      const margin = revenue > 0 ? ((profit/revenue)*100).toFixed(1) : 0;
      const el = (id) => document.getElementById(id);
      if (el('calcRevenue')) el('calcRevenue').textContent = '₵' + revenue.toLocaleString();
      if (el('calcProfit')) el('calcProfit').textContent = '₵' + profit.toLocaleString();
      if (el('calcMargin')) el('calcMargin').textContent = margin + '%';
      if (el('marginBar')) el('marginBar').style.width = Math.max(0, Math.min(100, parseFloat(margin))) + '%';
      if (el('displayedPrice')) el('displayedPrice').textContent = '₵' + price.toFixed(2) + '/kg';

    function handleGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const { region, district, community } = findNearestLocation(lat, lon);
            state.userData.region = region;
            state.userData.district = district;
            state.userData.community = community;
            navigate('crop_details');
          },
          () => {
            alert('Unable to get location. Please enable location access or select manually.');
            navigate('manual_location');
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 }
        );
      } else {
        alert('Geolocation is not supported by your browser.');
        navigate('manual_location');
      }
    }

    function findNearestLocation(lat, lon) {
      const ghanaBounds = [
        { name: 'Greater Accra Region', latMin: 5.5, latMax: 6.0, lonMin: -0.5, lonMax: 0.1, district: 'Accra Metropolitan', community: 'Accra' },
        { name: 'Volta Region', latMin: 5.5, latMax: 7.0, lonMin: 0.0, lonMax: 1.0, district: 'Ho Municipal', community: 'Ho' },
        { name: 'Eastern Region', latMin: 5.8, latMax: 6.8, lonMin: -1.0, lonMax: -0.2, district: 'New Juaben South Municipal', community: 'Koforidua' },
        { name: 'Central Region', latMin: 5.0, latMax: 5.8, lonMin: -1.5, lonMax: -0.8, district: 'Cape Coast Metropolitan', community: 'Cape Coast' },
        { name: 'Western Region', latMin: 4.5, latMax: 5.5, lonMin: -2.5, lonMax: -1.5, district: 'Sekondi Takoradi Metropolitan', community: 'Takoradi' },
        { name: 'Western North Region', latMin: 5.0, latMax: 6.0, lonMin: -3.0, lonMax: -2.0, district: 'Sefwi Wiawso Municipal', community: 'Sefwi Wiawso' },
        { name: 'Ashanti Region', latMin: 6.4, latMax: 7.2, lonMin: -2.1, lonMax: -1.2, district: 'Kumasi Metropolitan', community: 'Kumasi' },
        { name: 'Bono East Region', latMin: 7.2, latMax: 7.8, lonMin: -2.5, lonMax: -1.8, district: 'Techiman Municipal', community: 'Techiman' },
        { name: 'Ahafo Region', latMin: 7.2, latMax: 7.8, lonMin: -2.9, lonMax: -2.4, district: 'Asunafo North Municipal', community: 'Goaso' },
        { name: 'Brong-Ahafo Region', latMin: 7.0, latMax: 7.8, lonMin: -2.8, lonMax: -2.0, district: 'Sunyani Municipal', community: 'Sunyani' },
        { name: 'Northern Region', latMin: 8.5, latMax: 10.5, lonMin: -1.5, lonMax: 0.0, district: 'Tamale Metropolitan', community: 'Tamale' },
        { name: 'Savanna Region', latMin: 8.0, latMax: 9.5, lonMin: -2.5, lonMax: -1.5, district: 'Damongo Municipal', community: 'Damongo' },
        { name: 'North East Region', latMin: 9.5, latMax: 11.0, lonMin: -1.0, lonMax: 0.0, district: 'Nalerigu Gambaga Municipal', community: 'Nalerigu' },
        { name: 'Upper East Region', latMin: 10.3, latMax: 11.0, lonMin: -1.3, lonMax: -0.5, district: 'Bolgatanga Municipal', community: 'Bolgatanga' },
        { name: 'Upper West Region', latMin: 9.5, latMax: 11.0, lonMin: -2.8, lonMax: -1.8, district: 'Wa Municipal', community: 'Wa' },
        { name: 'Oti Region', latMin: 7.0, latMax: 8.5, lonMin: -0.5, lonMax: 0.8, district: 'Dambai Municipal', community: 'Dambai' }
      ];

      let closest = ghanaBounds[0];
      let minDist = Infinity;

      for (const r of ghanaBounds) {
        const dist = Math.sqrt(Math.pow(lat - r.latMin, 2) + Math.pow(lon - r.lonMin, 2));
        if (dist < minDist) {
          minDist = dist;
          closest = r;
        }
      }

      return { region: closest.name, district: closest.district, community: closest.community };
    }

    async function fetchEnvironmentalData(region) {
      const coords = ghanaCoordinates[region] || { lat: 9.4008, lon: -0.8429 };
      const defaults = regionDefaults[region] || { ndvi: 0.55, rainfall: 40, moisture: 55 };
      const year = new Date().getFullYear();
      const month = new Date().getMonth() + 1;

      let rainfall7d = defaults.rainfall;
      let ndvi = defaults.ndvi;
      let temp = 28, humidity = 65, wind = 12;
      let weatherDesc = 'Clear';

      try {
        const weatherResp = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m&daily=precipitation_sum&timezone=auto&forecast_days=16`
        );

        if (weatherResp.ok) {
          const data = await weatherResp.json();
          const current = data.current || {};
          temp = current.temperature_2m || 28;
          humidity = current.relative_humidity_2m || 65;
          wind = current.wind_speed_10m || 12;

          const weatherCodes = { 0: 'Clear', 1: 'Mainly Clear', 2: 'Partly Cloudy', 3: 'Overcast', 45: 'Fog', 48: 'Fog', 51: 'Drizzle', 53: 'Drizzle', 55: 'Drizzle', 61: 'Rain', 63: 'Rain', 65: 'Rain', 71: 'Snow', 73: 'Snow', 75: 'Snow', 80: 'Rain Showers', 82: 'Rain Showers', 95: 'Thunderstorm', 96: 'Thunderstorm', 99: 'Thunderstorm' };
          weatherDesc = weatherCodes[current.weather_code] || 'Clear';

          const daily = data.daily;
          if (daily?.precipitation_sum) {
            rainfall7d = Math.round(daily.precipitation_sum.slice(0, 7).reduce((a, b) => a + b, 0));
          }
          ndvi = defaults.ndvi + (Math.random() * 0.1 - 0.05);
        }
      } catch(e) {}

      const moistureLevel = rainfall7d > 60 ? 'Optimal' : rainfall7d > 40 ? 'Moderate' : 'Low';
      const ndviStatus = ndvi > 0.6 ? 'Good vegetation' : ndvi > 0.4 ? 'Moderate' : 'Poor';
      const rainStatus = rainfall7d > 50 ? 'Normal' : rainfall7d > 35 ? 'Below average' : 'Drought risk';

      return {
        ndvi: { current: Math.round(Math.max(0.3, Math.min(0.9, ndvi)) * 100) / 100, trend: ndvi > defaults.ndvi ? 'improving' : 'stable', status: ndviStatus },
        rainfall: { last7days: rainfall7d, expected: Math.round(defaults.rainfall * 1.1), status: rainStatus },
        soilMoisture: { level: moistureLevel, percent: Math.min(95, Math.round((rainfall7d / (defaults.rainfall || 1)) * defaults.moisture)) },
        weather: { temperature: Math.round(temp), humidity: Math.round(humidity), wind: Math.round(wind), description: weatherDesc }
      };
    }

    async function fetchPlantingWindow(region, year) {
      const coords = ghanaCoordinates[region] || { lat: 9.4008, lon: -0.8429 };
      const regionPlantingWindows = {
        "Greater Accra Region": { start: 'Apr 15', end: 'May 15', conf: 82 },
        "Ashanti Region": { start: 'May 20', end: 'Jun 05', conf: 88 },
        "Northern Region": { start: 'May 25', end: 'Jun 10', conf: 85 },
        "Central Region": { start: 'May 10', end: 'Jun 01', conf: 84 },
        "Eastern Region": { start: 'May 15', end: 'Jun 01', conf: 86 },
        "Volta Region": { start: 'Apr 20', end: 'May 20', conf: 83 },
        "Western Region": { start: 'Mar 15', end: 'May 15', conf: 85 },
        "Brong-Ahafo Region": { start: 'May 20', end: 'Jun 05', conf: 87 },
        "Upper East Region": { start: 'May 25', end: 'Jun 15', conf: 82 },
        "Upper West Region": { start: 'May 25', end: 'Jun 15', conf: 80 },
        "Oti Region": { start: 'May 01', end: 'Jun 01', conf: 81 },
        "Bono East Region": { start: 'May 15', end: 'Jun 01', conf: 86 },
        "Savanna Region": { start: 'May 20', end: 'Jun 15', conf: 79 },
        "North East Region": { start: 'May 20', end: 'Jun 15', conf: 80 },
        "Ahafo Region": { start: 'May 15', end: 'Jun 01', conf: 87 },
        "Western North Region": { start: 'Apr 20', end: 'Jun 01', conf: 84 }
      };

      try {
        const forecastResp = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&daily=precipitation_probability_max,precipitation_sum&timezone=auto&forecast_days=16`
        );

        if (forecastResp.ok) {
          const data = await forecastResp.json();
          const probs = data.daily?.precipitation_probability_max || [];
          const sums = data.daily?.precipitation_sum || [];
          const times = data.daily?.time || [];

          let bestStart = null, bestEnd = null, bestConf = 0;

          for (let i = 0; i < probs.length && i < sums.length; i++) {
            if (probs[i] > 40 && sums[i] > 2) {
              const date = times[i];
              if (!bestStart) {
                bestStart = date.slice(5);
                const endDate = new Date(date);
                endDate.setDate(endDate.getDate() + 10);
                bestEnd = endDate.toISOString().slice(5, 10);
                bestConf = Math.min(85, probs[i] + 10);
              }
            }
          }

          if (bestStart) return { start: bestStart, end: bestEnd, confidence: bestConf };
        }
      } catch(e) {}

      return regionPlantingWindows[region] || { start: 'May 20', end: 'Jun 05', conf: 82 };
    }

    async function fetchYieldEstimate(region, month, ndvi) {
      const defaults = regionDefaults[region] || { ndvi: 0.55 };
      const baseYield = 2000;
      const ndviFactor = ndvi / (defaults.ndvi || 0.5);
      const adjustedYield = Math.round(baseYield * ndviFactor * 0.9);
      const confidence = Math.min(90, Math.max(60, Math.round(ndvi * 100 - 10)));

      return { yieldPerAcre: adjustedYield, total: adjustedYield * 2, confidence: confidence };
    }

    async function fetchDroughtRisk(region) {
      const defaults = regionDefaults[region] || { rainfall: 40, moisture: 55 };
      const coords = ghanaCoordinates[region] || { lat: 9.4008, lon: -0.8429 };
      const year = new Date().getFullYear();

      try {
        const resp = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&daily=precipitation_probability_max,precipitation_sum&timezone=auto&forecast_days=16`
        );
        if (resp.ok) {
          const data = await resp.json();
          const probs = data.daily?.precipitation_probability_max || [];
          const sums = data.daily?.precipitation_sum || [];
          const avgProb = probs.length > 0 ? probs.reduce((a,b) => a+b, 0) / probs.length : 50;
          const totalRain = sums.reduce((a,b) => a+b, 0);

          const prob = avgProb < 30 ? 0.35 : avgProb < 50 ? 0.20 : 0.10;
          const riskLevel = prob > 0.25 ? 'high' : prob > 0.15 ? 'medium' : 'low';
          return { probability: prob, riskLevel: riskLevel };
        }
      } catch(e) {}

      const prob = defaults.rainfall < 35 ? 0.30 : defaults.rainfall < 45 ? 0.20 : 0.15;
      return { probability: prob, riskLevel: prob > 0.25 ? 'high' : prob > 0.15 ? 'medium' : 'low' };
    }

    async function handleGeneratePlan() {
      const btn = document.getElementById('generatePlanBtn');
      if (btn) {
        btn.disabled = true;

    async function generatePlan() {
      const region = state.userData.region || 'Northern Region';
      const crop = state.userData.crop || 'Maize';
      const acres = parseFloat(state.userData.acres) || 2;
      const currentMonth = new Date().toLocaleString('default', { month: 'long' });
      const currentYear = new Date().getFullYear();

      farmPlan.dataSources.satellite = ['Copernicus Sentinel-2', 'NASA Landsat', 'MODIS'];
      farmPlan.dataSources.weather = ['Open-Meteo', 'CHIRPS', 'NASA SMAP'];
      farmPlan.dataSources.official = ['MoFA Ghana'];

      const envData = await fetchEnvironmentalData(region);
      farmPlan.ndvi = envData.ndvi;
      farmPlan.rainfall = envData.rainfall;
      farmPlan.soilMoisture = envData.soilMoisture;
      farmPlan.weather = envData.weather;

      const plantWindow = await fetchPlantingWindow(region, currentYear);
      farmPlan.plantingWindow = plantWindow;
      farmPlan.harvestDate = plantWindow.end ? `${plantWindow.end} - ${plantWindow.end.slice(0,5)}15` : 'Calculating...';

      const yieldEst = await fetchYieldEstimate(region, currentMonth, farmPlan.ndvi.current);
      farmPlan.yieldEstimate = { perAcre: yieldEst.yieldPerAcre, total: yieldEst.total, confidence: yieldEst.confidence };
      farmPlan.optimal = {
        yieldPerAcre: yieldEst.yieldPerAcre,
        totalOutput: yieldEst.yieldPerAcre * acres,
        revenue: Math.round(yieldEst.yieldPerAcre * acres * state.marketPrice[crop]),
        profit: 0,
        profitMargin: 0,
        riskLevel: 'LOW'
      };
      farmPlan.optimal.profit = farmPlan.optimal.revenue - farmPlan.budget.totalCost;
      farmPlan.optimal.profitMargin = farmPlan.optimal.revenue > 0 ? ((farmPlan.optimal.profit / farmPlan.optimal.revenue) * 100).toFixed(1) : 0;

      const droughtRisk = await fetchDroughtRisk(region);
      const adverseYield = Math.round(yieldEst.yieldPerAcre * (1 - droughtRisk.probability));
      farmPlan.adverse = {
        yieldPerAcre: adverseYield,
        totalOutput: adverseYield * acres,
        revenue: Math.round(adverseYield * acres * state.marketPrice[crop]),
        profit: 0,
        profitMargin: 0,
        riskLevel: droughtRisk.riskLevel.toUpperCase()
      };
      farmPlan.adverse.profit = farmPlan.adverse.revenue - farmPlan.budget.totalCost;
      farmPlan.adverse.profitMargin = farmPlan.adverse.revenue > 0 ? ((farmPlan.adverse.profit / farmPlan.adverse.revenue) * 100).toFixed(1) : 0;

      const rainfallThreshold = 50;
      const ndviThreshold = 0.5;
      const currentNDVI = farmPlan.ndvi?.current || 0.5;
      const currentRain = farmPlan.rainfall?.last7days || 40;

      farmPlan.risks = [
        { driver: 'Rainfall variability', level: currentRain < rainfallThreshold ? 'High' : 'Medium', source: 'CHIRPS + Open-Meteo' },
        { driver: 'Dry spell probability', level: currentRain < rainfallThreshold * 0.7 ? 'High' : 'Medium', source: 'MODIS + CHIRPS' },
        { driver: 'Pest outbreak risk', level: currentNDVI < ndviThreshold ? 'High' : 'Low', source: 'NDVI + MoFA' }
      ];

      const budgetRevenue = farmPlan.optimal.revenue;
      farmPlan.budget.revenue = budgetRevenue;
      farmPlan.budget.profit = farmPlan.optimal.profit;

      state.plan = farmPlan;
      navigate('planting_window');
    }

    const CHAT_RESPONSES = {
      fertilizer: "You should first apply fertilizer between 20 Jun - 25 Jun 2026. Apply NPK (15-15-15) at 2 bags (100kg) per acre as basal fertilizer at planting.",
      weed: "First weeding should be done at 2-3 weeks after planting, and second weeding at 4-5 weeks after planting. Keeping the field weed-free in the early stages is crucial.",
      pest: "Monitor for stem borers from the 4th week after planting. Scout fields at least twice weekly and apply recommended pesticide at early detection.",
      harvest: "Harvest when cobs are fully matured and dry. Check moisture content should be below 15% before storage. Harvest within 2 weeks to avoid losses.",
      default: "I'm here to help! Ask me about:\n• Fertilizer application\n• Weed control\n• Pest management\n• Harvesting tips\n• Budget planning\n• Planting dates\n\nWhat would you like to know?"
    };

    async function fetchChatResponse(question) {
      const ndvi = farmPlan.ndvi?.current ?? 'N/A';
      const rainfall = farmPlan.rainfall?.last7days ?? 'N/A';
      const moisture = farmPlan.soilMoisture?.percent ?? 'N/A';
      const region = state.userData.region || 'Not set';
      const crop = state.userData.crop || 'Maize';
      const planting = farmPlan.plantingWindow?.start || 'TBD';

      const q = question.toLowerCase();
      let response = CHAT_RESPONSES.default;

      if (q.includes('fertilizer')) {
        response = `Based on your field (${region}), ${ndvi !== 'N/A' ? `NDVI ${ndvi}, ` : ''}apply NPK 15-15-15 at 2 bags/acre as basal. For top dressing, use 1 bag urea/acre 4-6 weeks after planting, preferably before expected rainfall.`;
      } else if (q.includes('weed')) {
        const weeks = rainfall < 40 ? '2 weeks' : '3 weeks';
        response = `First weeding at ${weeks} after planting is critical. Current soil moisture at ${moisture}% means weeds will compete strongly for water. Consider post-emergence herbicide if labor is scarce.`;
      } else if (q.includes('pest') || q.includes('disease')) {
        const risk = farmPlan.risks?.find(r => r.driver.toLowerCase().includes('pest'))?.level || 'Low';
        response = `Pest risk is ${risk}. Monitor fields twice weekly. With NDVI ${ndvi}, ${risk === 'High' ? 'vegetation stress may attract more pests' : 'conditions are generally favorable'}. Consider preventive IPM measures.`;
      } else if (q.includes('rain') || q.includes('drought')) {
        response = `Current 7-day rainfall: ${rainfall}mm. ${rainfall < 40 ? 'This indicates drought risk. Consider irrigation if available.' : 'Rainfall is adequate for maize development.'} Next planting window: ${planting}.`;
      } else if (q.includes('when') && (q.includes('plant') || q.includes('sow'))) {
        response = `Optimal planting window for ${region} is ${farmPlan.plantingWindow?.start || 'May 20'} - ${farmPlan.plantingWindow?.end || 'June 5'} (${farmPlan.plantingWindow?.confidence || 80}% confidence).`;
      } else if (q.includes('yield') || q.includes('expect')) {
        response = `Based on current NDVI ${ndvi}, expected yield is ${farmPlan.yieldEstimate?.perAcre || '~1800'} kg/acre. With ${crop}, total output would be ~${farmPlan.yieldEstimate?.total || '3600'} kg from your ${state.userData.acres || 2} acres.`;
      }

      return response;
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const msg = input.value.trim();
      if (!msg) return;

      const messages = document.getElementById('chat-messages');
      messages.innerHTML += `<div class="chat-bubble user"><p>${msg}</p></div>`;
      messages.innerHTML += `<div class="typing"><span></span><span></span><span></span></div>`;
      messages.scrollTop = messages.scrollHeight;
      input.value = '';

      const response = await fetchChatResponse(msg);

      setTimeout(() => {
        document.querySelector('.typing').remove();
        messages.innerHTML += `<div class="chat-bubble bot"><p>${response}</p></div>`;
        messages.scrollTop = messages.scrollHeight;
      }, 800);
    }

    function render() {
      const main = document.getElementById('main');
      const footer = document.getElementById('footer');
      const backBtn = document.getElementById('backBtn');

      document.querySelectorAll('footer button').forEach(btn => btn.classList.remove('active'));
      const navBtn = document.querySelector(`footer button[data-nav="${state.currentScreen}"]`);
      if (navBtn) navBtn.classList.add('active');

      const needsFooter = !['chat'].includes(state.currentScreen);
      footer.style.display = needsFooter ? 'flex' : 'none';

      const needsBack = ['location', 'manual_location', 'crop_details', 'planting_window', 'calendar', 'activity', 'budget', 'scenario', 'comparison', 'yield', 'risk', 'advisory', 'summary'].includes(state.currentScreen);
      backBtn.classList.toggle('hidden', !needsBack);

      if (state.currentScreen === 'welcome') {
        backBtn.classList.add('hidden');
      }

      const screenFn = SCREENS[state.currentScreen];
      if (screenFn) {
        const result = screenFn();
        if (result && typeof result.then === 'function') {
          main.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
          result.then(html => { main.innerHTML = html; }).catch(() => { main.innerHTML = '<div style="padding:16px">Loading data...</div>'; });
        } else {
          main.innerHTML = result;
        }
      }
      
      if (state.currentScreen === 'scenario') {
        renderScenarioContent();
      }
      
      if (state.currentScreen === 'chat') {
        setTimeout(() => document.getElementById('chat-input')?.focus(), 100);
      }
      
      window.scrollTo(0, 0);
    }

    render();
  </script>
